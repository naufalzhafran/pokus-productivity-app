server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        add_header Cache-Control "no-cache" always;
        include snippets/pokus-security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include snippets/pokus-security-headers.conf;
        try_files $uri =404;
    }

    location ~* \.(?:css|js|svg|ico|png|woff2?|webmanifest)$ {
        add_header Cache-Control "no-cache" always;
        include snippets/pokus-security-headers.conf;
        try_files $uri =404;
    }
}
